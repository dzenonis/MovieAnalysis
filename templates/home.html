<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Analysis Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Movie Analysis Dashboard</h1>
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Total Movies</h5>
                        <p class="card-text display-4">{{ total_movies }}</p>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="list-group">
                    <a href="/genre_analysis" class="list-group-item list-group-item-action">
                        Genre Analysis
                    </a>
                    <a href="/financial_analysis" class="list-group-item list-group-item-action">
                        Financial Performance
                    </a>
                    <a href="/rating_distribution" class="list-group-item list-group-item-action">
                        Rating Distribution
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
