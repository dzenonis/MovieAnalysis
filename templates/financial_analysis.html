<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Financial Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Movie Financial Performance</h1>
        <form method="POST" class="mb-4">
            <div class="row">
                <div class="col-md-5">
                    <input type="number" name="min_year" class="form-control" placeholder="Min Year" value="{{ min_year }}">
                </div>
                <div class="col-md-5">
                    <input type="number" name="max_year" class="form-control" placeholder="Max Year" value="{{ max_year }}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary">Filter</button>
                </div>
            </div>
        </form>
        <div class="row">
            <div class="col-md-6">
                <h3>Yearly Financial Data</h3>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Year</th>
                            <th>Avg Budget</th>
                            <th>Avg Revenue</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for data in financial_data %}
                        <tr>
                            <td>{{ data.year }}</td>
                            <td>${{ data.avg_budget|int }}</td>
                            <td>${{ data.avg_revenue|int }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <div class="col-md-6">
                <h3>Budget vs Revenue</h3>
                <img src="data:image/png;base64,{{ financial_chart }}" class="img-fluid">
            </div>
        </div>
        <a href="/" class="btn btn-secondary mt-3">Back to Home</a>
    </div>
</body>
</html>
