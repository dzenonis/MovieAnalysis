<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Genre Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Movie Genre Distribution</h1>
        <div class="row">
            <div class="col-md-6">
                <h3>Genre Counts</h3>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Genre</th>
                            <th>Number of Movies</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for gc in genre_counts %}
                        <tr>
                            <td>{{ gc.genre }}</td>
                            <td>{{ gc.count }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <div class="col-md-6">
                <h3>Genre Pie Chart</h3>
                <img src="data:image/png;base64,{{ genre_pie_chart }}" class="img-fluid">
            </div>
        </div>
        <a href="/" class="btn btn-secondary mt-3">Back to Home</a>
    </div>
</body>
</html>
